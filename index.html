<style>
:root {
  --livecard-bg: #111827;
  --livecard-card-bg: #1f2937;
  --livecard-primary: #10b981;
  --livecard-live: #ef4444;
  --livecard-upcoming: #22c55e;
  --livecard-finished: #6b7280;
  --livecard-text: #ffffff;
  --livecard-muted: #9ca3af;
  --livecard-border: #374151;
}

.livecard-container {
  padding: 5px;
  display: grid;
  gap: 1rem;
    max-width: 680px;
    margin: 0 auto;
}

/* =========================================================
   MODERN MATCH CARD
   ========================================================= */

.livecard-match {
  --card-bg: #ffffff;
  --card-border: rgba(15, 23, 42, .08);
  --card-text: #0f172a;
  --card-muted: #64748b;
  --card-soft: #f8fafc;
  --accent: #2563eb;

  position: relative;
  overflow: hidden;

  width: 100%;
  padding: 18px;

  background:
    linear-gradient(145deg, #ffffff 0%, #f8fafc 100%);

  border: 1px solid var(--card-border);
  border-radius: 22px;

  box-shadow:
    0 8px 30px rgba(15, 23, 42, .07),
    0 2px 8px rgba(15, 23, 42, .04);

  cursor: pointer;

  transition:
    transform .25s ease,
    box-shadow .25s ease,
    border-color .25s ease;

  box-sizing: border-box;
}

.livecard-match:hover {
  transform: translateY(-3px);

  border-color: rgba(37, 99, 235, .18);

  box-shadow:
    0 18px 45px rgba(15, 23, 42, .11),
    0 5px 15px rgba(37, 99, 235, .06);
}

.livecard-match:active {
  transform: translateY(-1px) scale(.995);
}


/* subtle top glow */

.livecard-match::before {
  content: "";

  position: absolute;
  top: -80px;
  right: -80px;

  width: 180px;
  height: 180px;

  background: rgba(37, 99, 235, .07);

  border-radius: 50%;

  pointer-events: none;
}


/* =========================================================
   HEADER
   ========================================================= */

.livecard-header {
  position: relative;
  z-index: 2;

  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 12px;

  margin-bottom: 16px;
}

.livecard-competition {
  min-width: 0;

  color: var(--card-text);

  font-size: 13px;
  font-weight: 800;

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.livecard-badge {
  flex-shrink: 0;

  display: inline-flex;
  align-items: center;
  gap: 6px;

  min-height: 27px;
  padding: 5px 10px;

  border-radius: 999px;

  font-size: 10px;
  font-weight: 900;

  letter-spacing: .05em;
  text-transform: uppercase;
}

.livecard-badge.live {
  color: #dc2626;
  background: #fef2f2;
}

.livecard-badge.live::before {
  content: "";

  width: 7px;
  height: 7px;

  background: #ef4444;

  border-radius: 50%;

  box-shadow: 0 0 0 4px rgba(239, 68, 68, .12);

  animation: livePulse 1.5s infinite;
}

.livecard-badge.upcoming {
  color: #2563eb;
  background: #eff6ff;
}

.livecard-badge.finished {
  color: #475569;
  background: #f1f5f9;
}

@keyframes livePulse {
  0%, 100% {
    opacity: 1;
  }

  50% {
    opacity: .4;
  }
}


/* =========================================================
   DATE / TIME
   ========================================================= */

.livecard-date {
  position: relative;
  z-index: 2;

  display: flex;
  align-items: center;
  justify-content: center;

  gap: 7px;

  margin-bottom: 20px;

  color: var(--card-muted);

  font-size: 11px;
  font-weight: 600;

  text-align: center;
}

.livecard-time {
  color: var(--card-text);

  font-size: 15px;
  font-weight: 900;
}

.livecard-date-separator {
  opacity: .45;
}


/* =========================================================
   TEAMS
   ========================================================= */

.livecard-teams {
  position: relative;
  z-index: 2;

  display: grid;

  grid-template-columns:
    minmax(0, 1fr)
    70px
    minmax(0, 1fr);

  align-items: center;

  gap: 8px;

  padding: 4px 0 18px;
}

.livecard-team {
  min-width: 0;

  display: flex;
  flex-direction: column;
  align-items: center;

  gap: 10px;

  text-align: center;
}

.livecard-team img {
  width: 62px;
  height: 62px;

  object-fit: contain;

  padding: 8px;

  background: #ffffff;

  border: 1px solid rgba(15, 23, 42, .07);

  border-radius: 18px;

  box-shadow:
    0 7px 20px rgba(15, 23, 42, .08);

  transition: transform .25s ease;
}

.livecard-match:hover .livecard-team img {
  transform: scale(1.05);
}

.livecard-team-name {
  width: 100%;

  color: var(--card-text);

  font-size: 13px;
  font-weight: 800;

  line-height: 1.3;

  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;

  overflow: hidden;
}


/* =========================================================
   CENTER VS
   ========================================================= */

.livecard-center {
  display: flex;
  flex-direction: column;
  align-items: center;

  gap: 5px;
}

.livecard-vs {
  width: 48px;
  height: 48px;

  display: flex;
  align-items: center;
  justify-content: center;

  color: #334155;

  background: #f8fafc;

  border: 1px solid rgba(15, 23, 42, .08);

  border-radius: 50%;

  font-size: 12px;
  font-weight: 900;

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.8);
}

.livecard-score {
  font-size: 20px;
  font-weight: 950;

  color: #0f172a;

  letter-spacing: -.04em;
}


/* =========================================================
   FOOTER
   ========================================================= */

.livecard-bottom {
  position: relative;
  z-index: 2;

  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 10px;

  padding-top: 13px;

  border-top: 1px solid rgba(15, 23, 42, .07);
}

.livecard-streamers {
  min-width: 0;

  color: var(--card-muted);

  font-size: 11px;
  font-weight: 600;

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.livecard-share {
  flex-shrink: 0;

  width: 34px;
  height: 34px;

  display: flex;
  align-items: center;
  justify-content: center;

  color: #475569;

  background: #f8fafc;

  border: 1px solid rgba(15, 23, 42, .08);

  border-radius: 11px;

  cursor: pointer;

  transition:
    color .2s ease,
    background .2s ease,
    transform .2s ease;
}

.livecard-share:hover {
  color: #2563eb;
  background: #eff6ff;

  transform: translateY(-1px);
}

.livecard-share svg {
  width: 17px;
  height: 17px;
}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 480px) {

  .livecard-match {
    padding: 15px;
    border-radius: 19px;
  }

  .livecard-teams {
    grid-template-columns:
      minmax(0, 1fr)
      55px
      minmax(0, 1fr);
  }

  .livecard-team img {
    width: 54px;
    height: 54px;
    padding: 7px;
    border-radius: 15px;
  }

  .livecard-team-name {
    font-size: 12px;
  }

  .livecard-vs {
    width: 42px;
    height: 42px;
  }

  .livecard-score {
    font-size: 18px;
  }
}

<script>
/* =========================================================
   MATCH DATA
========================================================= */

let matchList = [];

const MATCH_API =
  'https://idlive.falou.net/live/list';

const MATCH_CACHE_KEY =
  'score808_match_cache_v2';

const MATCH_CACHE_TIME =
  15000;


/* =========================================================
   ELEMENT
========================================================= */

const matchContainer =
  document.getElementById('live-matches');


/* =========================================================
   SKELETON LOADING
========================================================= */

function showMatchSkeleton() {

  if (!matchContainer) return;

  matchContainer.innerHTML = `
    <div class="match-skeleton-list">

      ${Array.from({ length: 4 }).map(function () {
        return `
          <div class="match-skeleton">

            <div class="skeleton-line skeleton-top"></div>

            <div class="skeleton-date"></div>

            <div class="skeleton-teams">

              <div class="skeleton-team">
                <div class="skeleton-logo"></div>
                <div class="skeleton-name"></div>
              </div>

              <div class="skeleton-vs"></div>

              <div class="skeleton-team">
                <div class="skeleton-logo"></div>
                <div class="skeleton-name"></div>
              </div>

            </div>

            <div class="skeleton-bottom"></div>

          </div>
        `;
      }).join('')}

    </div>
  `;
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value) {

  return String(value || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');

}


/* =========================================================
   RENDER MATCH
========================================================= */

function renderMatches(matches) {

  if (!matchContainer) return;

  if (!Array.isArray(matches) || matches.length === 0) {

    matchContainer.innerHTML =
      '<p>Tidak ada pertandingan ditemukan.</p>';

    return;

  }


  matchContainer.innerHTML =
    matches.map(function (match, index) {

      const matchDate =
        new Date(
          Number(match.match_time) * 1000
        );


      const matchTime =
        matchDate.toLocaleTimeString(
          'id-ID',
          {
            hour: '2-digit',
            minute: '2-digit'
          }
        );


      const matchDay =
        matchDate.toLocaleDateString(
          'id-ID',
          {
            weekday: 'long',
            day: 'numeric',
            month: 'long',
            year: 'numeric'
          }
        );


      /* STATUS */

      let statusClass = 'upcoming';
      let statusText = 'Upcoming';


      if (
        match.type &&
        String(match.type).includes('live')
      ) {

        statusClass = 'live';
        statusText = 'LIVE';

      } else if (
        [8, 9].includes(
          Number(match.status_id)
        )
      ) {

        statusClass = 'finished';
        statusText = 'Selesai';

      }


      /* STREAMERS */

      const streamers =
        Object.values(
          match.streamers || {}
        );


      const streamerNames =
        streamers
          .map(function (streamer) {
            return streamer && streamer.name
              ? streamer.name
              : '';
          })
          .filter(Boolean)
          .join(' - ');


      const streamerText =
        streamerNames ||
        'Tidak ada streamer';


      /* DATA */

      const matchId =
        escapeHtml(
          match.match_id || ''
        );


      const competition =
        escapeHtml(
          match.competition_name ||
          'Football'
        );


      const homeName =
        escapeHtml(
          match.home_name ||
          'Home'
        );


      const awayName =
        escapeHtml(
          match.away_name ||
          'Away'
        );


      const homeLogo =
        escapeHtml(
          match.home_logo || ''
        );


      const awayLogo =
        escapeHtml(
          match.away_logo || ''
        );


      /*
       * Logo pertama dimuat eager
       * agar visual awal lebih cepat.
       */

      const imageLoading =
        index < 4
          ? 'eager'
          : 'lazy';


      return (

        '<div class="livecard-match" ' +

        'data-match-id="' +
        matchId +
        '" ' +

        'onclick="handleMatchClick(' +
        index +
        ')" ' +

        'style="cursor:pointer;">' +


        /* HEADER */

        '  <div class="livecard-header">' +

        '    <div class="livecard-competition">' +
        competition +
        '</div>' +

        '    <span class="livecard-badge ' +
        statusClass +
        '">' +
        statusText +
        '</span>' +

        '  </div>' +


        /* DATE */

        '  <div class="livecard-date">' +

        '    <span class="livecard-time">' +
        matchTime +
        '</span>' +

        '    <span class="livecard-date-separator">•</span>' +

        '    <span>' +
        matchDay +
        '</span>' +

        '  </div>' +


        /* TEAMS */

        '  <div class="livecard-teams">' +


        '    <div class="livecard-team">' +

        '      <img ' +
        'src="' + homeLogo + '" ' +
        'alt="' + homeName + '" ' +
        'width="64" ' +
        'height="64" ' +
        'decoding="async" ' +
        'loading="' + imageLoading + '">' +

        '      <div class="livecard-team-name">' +
        homeName +
        '</div>' +

        '    </div>' +


        '    <div class="livecard-center">' +

        '      <div class="livecard-vs">VS</div>' +

        '    </div>' +


        '    <div class="livecard-team">' +

        '      <img ' +
        'src="' + awayLogo + '" ' +
        'alt="' + awayName + '" ' +
        'width="64" ' +
        'height="64" ' +
        'decoding="async" ' +
        'loading="' + imageLoading + '">' +

        '      <div class="livecard-team-name">' +
        awayName +
        '</div>' +

        '    </div>' +


        '  </div>' +


        /* BOTTOM */

        '  <div class="livecard-bottom">' +


        '    <div class="livecard-streamers">' +

        (
          streamerNames
            ? '● ' + escapeHtml(streamerText)
            : 'Informasi pertandingan'
        ) +

        '</div>' +


        /* ACTIONS */

        '    <div class="livecard-actions">' +


        /* COPY */

        '      <button ' +
        'type="button" ' +
        'class="livecard-copy" ' +
        'onclick="event.stopPropagation(); copyMatch(' +
        index +
        ')" ' +
        'aria-label="Copy Match">' +

        '        <svg viewBox="0 0 24 24" fill="none">' +

        '          <rect ' +
        'x="8" y="8" width="11" height="11" rx="2" ' +
        'stroke="currentColor" stroke-width="2"/>' +

        '          <path ' +
        'd="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" ' +
        'stroke="currentColor" stroke-width="2" ' +
        'stroke-linecap="round"/>' +

        '        </svg>' +

        '        <span>Copy Match</span>' +

        '      </button>' +


        /* SHARE */

        '      <button ' +
        'type="button" ' +
        'class="livecard-share" ' +
        'onclick="event.stopPropagation(); shareMatch(' +
        index +
        ')" ' +
        'aria-label="Share Match">' +

        '        <svg viewBox="0 0 24 24" fill="none">' +

        '          <circle cx="18" cy="5" r="2.5" ' +
        'stroke="currentColor" stroke-width="2"/>' +

        '          <circle cx="6" cy="12" r="2.5" ' +
        'stroke="currentColor" stroke-width="2"/>' +

        '          <circle cx="18" cy="19" r="2.5" ' +
        'stroke="currentColor" stroke-width="2"/>' +

        '          <path ' +
        'd="M8.2 10.8l7.6-4.4M8.2 13.2l7.6 4.4" ' +
        'stroke="currentColor" stroke-width="2" ' +
        'stroke-linecap="round"/>' +

        '        </svg>' +

        '      </button>' +


        '    </div>' +

        '  </div>' +

        '</div>'

      );

    }).join('');


  /*
   * Setelah card tampil,
   * buka match dari URL jika ada.
   */

  openMatchFromUrl();

}


/* =========================================================
   CACHE
========================================================= */

function getCachedMatches() {

  try {

    const cached =
      sessionStorage.getItem(
        MATCH_CACHE_KEY
      );

    if (!cached) {
      return null;
    }


    const parsed =
      JSON.parse(cached);


    if (
      !parsed ||
      !parsed.time ||
      !Array.isArray(parsed.data)
    ) {
      return null;
    }


    /*
     * Cache hanya digunakan
     * maksimal 15 detik.
     */

    if (
      Date.now() - parsed.time >
      MATCH_CACHE_TIME
    ) {

      sessionStorage.removeItem(
        MATCH_CACHE_KEY
      );

      return null;

    }


    return parsed.data;

  } catch (error) {

    return null;

  }

}


/* =========================================================
   SAVE CACHE
========================================================= */

function saveMatchesCache(matches) {

  try {

    sessionStorage.setItem(
      MATCH_CACHE_KEY,
      JSON.stringify({
        time: Date.now(),
        data: matches
      })
    );

  } catch (error) {

    /* Ignore storage error */

  }

}


/* =========================================================
   LOAD API
========================================================= */

async function loadMatches() {

  if (!matchContainer) return;


  /*
   * Skeleton langsung tampil.
   */

  showMatchSkeleton();


  /*
   * Gunakan cache terlebih dahulu
   * agar halaman tidak terlihat kosong.
   */

  const cached =
    getCachedMatches();


  if (cached) {

    matchList = cached;

    renderMatches(matchList);

  }


  /*
   * Timeout API
   */

  const controller =
    new AbortController();


  const timeout =
    setTimeout(function () {

      controller.abort();

    }, 10000);


  try {

    const response =
      await fetch(
        MATCH_API,
        {
          method: 'GET',
          cache: 'no-store',
          signal: controller.signal
        }
      );


    clearTimeout(timeout);


    if (!response.ok) {

      throw new Error(
        'HTTP ' +
        response.status
      );

    }


    const data =
      await response.json();


    if (
      !data ||
      !data.data ||
      !Array.isArray(data.data.list)
    ) {

      throw new Error(
        'Format API tidak valid'
      );

    }


    matchList =
      data.data.list;


    /*
     * Simpan cache
     */

    saveMatchesCache(
      matchList
    );


    /*
     * Render satu kali
     */

    renderMatches(
      matchList
    );


  } catch (error) {

    clearTimeout(timeout);


    /*
     * Jika cache sudah tampil,
     * jangan mengganti card dengan error.
     */

    if (
      !matchList ||
      matchList.length === 0
    ) {

      matchContainer.innerHTML =
        '<p>Gagal memuat data pertandingan.</p>';

    }


    console.error(
      'Gagal memuat pertandingan:',
      error
    );

  }

}


/* =========================================================
   START
========================================================= */

loadMatches();


/* =========================================================
   STREAM LINK
========================================================= */

function makeStreamLink(
  streamUrl,
  cover
) {

  if (!streamUrl) {
    return null;
  }


  const convertedUrl =

      'bf.jalaplay.net',

    );

    encodeURIComponent(

    ) +

    encodeURIComponent(
      cover ||
      'https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjXZtZi0_3WuPLAJYIccfp6zTb3AIAwzSy0kcpeoGg62Z-C3m63KoRlnxsgBEvJoNf2ngUG1jWonFXQ9ui3ED9VMtSj_Utkw5hl2pJhjrmEUD8527M1BIrFrYZ2uMtsZNYe22CXvE4sy9By3pyJ-Z5V7ib2GqRniwvm2XbN1fypkORUaRNhXMPGqRYoF2w/s1600/wwwscore808myid.png'
    ) +

/* =========================================================
   IFRAME
========================================================= */

function setIframe(
  iframeUrl
) {

  const player =
    document.getElementById(
      'stream-player'
    );


  const container =
    document.querySelector(
      '.iframe-container'
    );


  if (
    !player ||
    !container
  ) {
    return;
  }


  player.src =
    iframeUrl;


  container.classList.add(
    'match-player-active'
  );


  setTimeout(function () {

    container.scrollIntoView({
      behavior: 'smooth',
      block: 'start'
    });

  }, 100);

}


/* =========================================================
   MATCH CLICK
========================================================= */

function handleMatchClick(
  index
) {

  const match =
    matchList[index];


  if (!match) {

    alert(
      'Pertandingan tidak tersedia.'
    );

    return;

  }


  /* =====================================================
     UPDATE URL
  ===================================================== */

  if (match.match_id) {

    const matchId =
      String(
        match.match_id
      );


    const currentMatch =
      new URLSearchParams(
        window.location.search
      ).get('match');


    if (
      String(currentMatch) !==
      matchId
    ) {

      const pageUrl =
        window.location.origin +
        window.location.pathname +
        '?match=' +
        encodeURIComponent(
          matchId
        );


      window.history.pushState(
        {
          match: matchId
        },
        '',
        pageUrl
      );

    }

  }


  /* =====================================================
     STREAMER
  ===================================================== */

  const streamers =
    Object.values(
      match.streamers || {}
    );


  const cover =
    match.cover;


  /* =====================================================
     MATCH INFO IFRAME
  ===================================================== */

  if (match.match_id) {

    const matchUrl =
      'https://widgets-livetracker.nami.com/id/football' +
      '?profile=g9rzlugz3uxie81' +
      '&trend=0' +
      '&id=' +
      encodeURIComponent(
        match.match_id
      ) +
      '&timezone=%207%3A00';


    const encodedMatch =
      btoa(
        unescape(
          encodeURIComponent(
            matchUrl
          )
        )
      );


    const iframeUrl =
      'https://play.beritanasional.eu.org/watch?url+' +
      encodedMatch;


    setIframe(
      iframeUrl
    );

  } else {

    alert(
      'match_id tidak tersedia.'
    );

/* =========================================================
   OPEN MATCH FROM URL
========================================================= */

function openMatchFromUrl() {

  const params =
    new URLSearchParams(
      window.location.search
    );


  const matchId =
    params.get('match');


  if (!matchId) {
    return;
  }


  const index =
    matchList.findIndex(
      function (match) {

        return (
          String(
            match.match_id
          ) ===
          String(matchId)
        );

      }
    );


  if (index === -1) {

    console.log(
      'Match tidak ditemukan:',
      matchId
    );

    return;

  }


  setTimeout(function () {

    const cards =
      document.querySelectorAll(
        '.livecard-match'
      );


    let card = null;


    cards.forEach(
      function (item) {

        if (
          String(
            item.getAttribute(
              'data-match-id'
            )
          ) ===
          String(matchId)
        ) {

          card = item;

        }

      }
    );


    if (card) {

      card.scrollIntoView({
        behavior: 'smooth',
        block: 'center'
      });

    }


    handleMatchClick(
      index
    );


  }, 300);

}


/* =========================================================
   SHARE MATCH
========================================================= */

async function shareMatch(
  index
) {

  const match =
    matchList[index];


  if (
    !match ||
    !match.match_id
  ) {
    return;
  }


  const url =
    new URL(
      window.location.href
    );


  url.search = '';


  url.searchParams.set(
    'match',
    match.match_id
  );


  const title =
    (
      match.home_name ||
      'Home'
    ) +
    ' vs ' +
    (
      match.away_name ||
      'Away'
    );


  const text =
    title +
    ' • ' +
    (
      match.competition_name ||
      'Pertandingan'
    );


  if (
    navigator.share
  ) {

    try {

      await navigator.share({

        title: title,

        text: text,

        url: url.toString()

      });


      return;

    } catch (error) {

      if (
        error &&
        error.name ===
        'AbortError'
      ) {

        return;

      }

    }

  }


  try {

    await navigator.clipboard.writeText(
      url.toString()
    );


    if (
      typeof showShareToast ===
      'function'
    ) {

      showShareToast(
        'Link pertandingan berhasil disalin'
      );

    }

  } catch (error) {

    window.prompt(
      'Salin link pertandingan:',
      url.toString()
    );

  }

}
</script>

<script>
async function copyMatch(index) {

  const match = matchList[index];

  if (!match || !match.match_id) {
    showShareToast('Match ID tidak tersedia');
    return;
  }

  const url = new URL(window.location.href);

  /*
   * Buang query lama
   * lalu buat URL khusus pertandingan
   */
  url.search = '';
  url.hash = '';

  url.searchParams.set(
    'match',
    match.match_id
  );

  const matchUrl = url.toString();

  try {

    await navigator.clipboard.writeText(matchUrl);

    showShareToast(
      '✓ Link pertandingan berhasil disalin'
    );

  } catch (error) {

    /*
     * Fallback untuk browser
     * yang tidak mendukung Clipboard API
     */
    const textarea =
      document.createElement('textarea');

    textarea.value = matchUrl;

    textarea.style.position = 'fixed';
    textarea.style.left = '-9999px';
    textarea.style.top = '0';

    document.body.appendChild(textarea);

    textarea.focus();
    textarea.select();

    try {

      document.execCommand('copy');

      showShareToast(
        '✓ Link pertandingan berhasil disalin'
      );

    } catch (e) {

      window.prompt(
        'Salin link pertandingan:',
        matchUrl
      );

    }

    document.body.removeChild(textarea);

  }

}


/*
 * TOAST
 */
let shareToastTimer = null;

function showShareToast(message) {

  let toast =
    document.getElementById('shareToast');

  /*
   * Jika element belum ada,
   * buat otomatis
   */
  if (!toast) {

    toast =
      document.createElement('div');

    toast.id = 'shareToast';

    toast.className =
      'score808-share-toast';

    document.body.appendChild(toast);

  }

  toast.textContent = message;

  toast.classList.add('show');

  clearTimeout(shareToastTimer);

  shareToastTimer =
    setTimeout(() => {

      toast.classList.remove('show');

    }, 2200);

}
</script>

      return {
        "@context": "https://schema.org",

          ? "https://schema.org/EventCompleted"
          : "https://schema.org/EventScheduled",

          "logo": match.home_logo

    });
